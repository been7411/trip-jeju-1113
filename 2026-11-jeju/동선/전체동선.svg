<line x1="885" y1="96" x2="920" y2="96" stroke="#e76f51" stroke-width="5"/><text x="930" y="101" font-weight="bold">1일차 11/13 (금)</text>
<text x="885" y="124">1안: 공항 → 함덕 → 김녕 → 월정리</text>
<text x="885" y="143">　　→ 성산 → 표선 → 서귀포</text>
<text x="885" y="165">2안: 성산 합류 → 섭지코지 → 표선</text>
<text x="885" y="184">　　→ 남원 큰엉 → 서귀포</text>

<line x1="885" y1="218" x2="920" y2="218" stroke="#2a9d8f" stroke-width="5"/><text x="930" y="223" font-weight="bold">2일차 11/14 (토)</text>
