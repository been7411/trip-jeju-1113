<text x="885" y="365">백록담 왕복 7~9시간</text>
<text x="885" y="384">예약 필수, 공식 사이트 확인 필요</text>

<line x1="885" y1="418" x2="920" y2="418" stroke="#8d6bb8" stroke-width="3" stroke-dasharray="3,6"/><text x="930" y="423" font-weight="bold">4일차 11/16 (월)</text>
<text x="885" y="446">렌터카 반납 08:30~09:00</text>
<text x="885" y="465">→ 제주공항 → 10시 전 대구행 ✈</text>

<text x="885" y="510" fill="#777" font-size="12">숙소 B안(추천): 서귀포 1박(13)</text>
