<text x="885" y="265">→ 신창풍차 → 협재·금능 노을</text>
<text x="885" y="284">B안은 이후 제주시 숙소로 (점선)</text>

<line x1="885" y1="318" x2="920" y2="318" stroke="#457b9d" stroke-width="5" stroke-dasharray="10,6"/><text x="930" y="323" font-weight="bold">3일차 11/15 (일)</text>
